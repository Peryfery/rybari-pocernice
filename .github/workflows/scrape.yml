name: ČRS Web Synchronizace

on:
  schedule:
    - cron: '0 3 * * 0,3' # Běží v neděli a ve středu v 03:00 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Načtení kódu z repozitáře
        uses: actions/checkout@v4

      - name: Nastavení prostředí Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalace potřebných knihoven pro robota
        run: |
          npm init -y
          npm install axios cheerio @supabase/supabase-js

      - name: Spuštění stahovacího skriptu
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scrape.js

      # POJISTKA: Volá kořenové OpenAPI rozhraní Supabase (nevyžaduje název tabulky)
      - name: Pojistný ping do Supabase
        if: always()
        run: |
          curl -i "${{ secrets.SUPABASE_URL }}/rest/v1/" \
          -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
